[project]
name = "PyronyModManager"
version = "0.2.0"
requires-python = ">=3.14"
dependencies = [
    "PySide6>=6.10.1", # Python 3.14 support; LGPL
    "msgspec", # fast JSON serialization for storage
    "httpx", # HTTP client for update checker
    "watchfiles>=1.3.0", # hot-reload mod directory
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]

[project.scripts]
pyirony = "app:main"

[tool.setuptools.package-data]
pmm = ["data/semantics/**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
